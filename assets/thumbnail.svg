<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Conclave thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- three personas around a table -->
  <g fill="none" stroke-linecap="round">
    <circle cx="640" cy="430" r="150" stroke="#2a3140" stroke-width="6"/>
    <circle cx="500" cy="360" r="26" fill="#f0b90b" stroke="none"/>
    <text x="500" y="330" text-anchor="middle" font-family="monospace" font-size="30" fill="#f0b90b">🐂 BULL</text>
    <circle cx="780" cy="360" r="26" fill="#4a9eff" stroke="none"/>
    <text x="780" y="330" text-anchor="middle" font-family="monospace" font-size="30" fill="#4a9eff">📊 QUANT</text>
    <circle cx="640" cy="530" r="26" fill="#e5484d" stroke="none"/>
    <text x="640" y="585" text-anchor="middle" font-family="monospace" font-size="30" fill="#e5484d">🛡️ RISK (veto)</text>
  </g>

  <!-- white smoke -->
  <circle cx="640" cy="150" r="22" fill="#f4f4f5"/>
  <text x="640" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="8">CONCLAVE</text>
  <text x="640" y="205" text-anchor="middle" font-family="monospace" font-size="30" fill="#9aa4b2">Three agents, locked room, one verdict.</text>
  <text x="640" y="665" text-anchor="middle" font-family="monospace" font-size="26" fill="#6b7480">No trade without white smoke · Binance Agent OS Mini Hackathon</text>
</svg>
