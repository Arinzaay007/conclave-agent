name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Core has zero runtime deps; test with nothing installed first.
      - name: Run demo (no deps)
        run: node demo/run.js > /tmp/demo.out && grep -q "WHITE SMOKE" /tmp/demo.out
      - name: Run tests (no deps)
        run: npm test
      - name: Install full deps and re-test
        run: npm install && npm test
